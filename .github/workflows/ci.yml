name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - feature/batch-api/rc

permissions:
  contents: read

jobs:
  check:
    name: "Lint, typecheck, and test"
    runs-on: ubuntu-latest
    steps:
      - name: "Fetch source code"
        uses: actions/checkout@v4

      - name: "Install uv"
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: "Install dependencies"
        run: uv sync --all-extras

      - name: "Lint, format check, and typecheck"
        run: make check

      - name: "Generated models match the spec"
        # Offline: codegen reads docs/openapi.yaml. Ignores the timestamp header.
        run: |
          make generate
          git diff --exit-code -I '^#   timestamp:' -- src/zenrows/batch/models.py

      - name: "Unit tests"
        run: make test
